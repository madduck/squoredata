name: Style and unit tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  run-tests:
    name: "Setup and run tests"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Check out the source
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Style and formatting (ruff)
        run: uv run ruff check .

      - name: Unit and integration tests (pytest)
        run: uv run pytest

      - name: Mypy check
        run: uv run mypy --strict .

      - name: Security lint (bandit)
        run: uv run bandit -c pyproject.toml -r .

      - name: Install Node dependencies
        run: npm install

      - name: Regenerate the TypeScript bindings
        run: uv run python scripts/generate_ts.py

      - name: Fail if the generated bindings are stale
        run: git diff --exit-code typescript/

      - name: Type-check and run the golden tests (npm)
        run: npm test
