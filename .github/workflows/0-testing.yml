# Run the tests on every push and pull request.
#
# The job definitions live in _tests.yml, which the release workflow calls as
# well, so there is exactly one place that defines what "passing" means.
name: Unit and style tests

on:
  push:
  pull_request:
  workflow_dispatch: # allows manual triggering

jobs:
  tests:
    name: "Tests"
    uses: ./.github/workflows/_tests.yml
