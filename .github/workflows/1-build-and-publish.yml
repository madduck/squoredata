# Build and publish a release.
#
# Triggered by a `v*` tag.  A manual run on a branch only runs the tests and
# the build; publishing stays gated on the tag ref, because a manual run has no
# tag and would try to publish a version that does not exist.
#
# The jobs run in three stages:
#
#   1. `tests` calls _tests.yml.  Nothing is built before the tests pass.
#   2. `build` builds the Python distributions and packs the TypeScript
#      tarball, and uploads both as artifacts.
#   3. `github-release`, `publish-to-pypi`, `publish-to-jsr`, and
#      `publish-to-npm` run in parallel, strictly after `build`, and consume
#      those artifacts.
name: Build package, make a release, publish to PyPI, JSR and npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # allows manual triggering

jobs:
  tests:
    name: "Tests"
    uses: ./.github/workflows/_tests.yml

  build:
    name: "Build packages"
    runs-on: ubuntu-latest
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check out the source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.x
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install the build tool
        run: python -m pip install build

      # The Hatchling hook regenerates the TypeScript bindings during the
      # build, but only when Node tooling is present.  Installing it here means
      # the wheel is generated from the models rather than from whatever the
      # tree happens to contain.  A build must never reach the network, so the
      # hook stays guarded; the tests have already proven the committed
      # bindings are not stale.
      - name: Install Node dependencies
        run: npm install

      - name: Build the Python package
        run: python -m build

      # The generated manifests carry the placeholder version, because they are
      # version-independent artefacts.  Stamp the version from the tag so the
      # tarball and the JSR package carry a real version.
      - name: Stamp the release version into the TypeScript manifests
        run: python scripts/stamp_version.py "$GITHUB_REF_NAME"

      # The tarball serves three consumers: npmjs, the JSR publish (which
      # publishes the source tree, not the tarball), and the GitHub Release
      # asset.  Packing once here keeps all three byte-identical.
      #
      # It is also the registry-free fallback: it installs straight from the
      # release with `npm install <url>`, which needs no account anywhere.
      - name: Pack the TypeScript package
        run: npm pack --pack-destination ../dist
        working-directory: typescript

      - name: Upload the Python distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Upload the TypeScript tarball
        uses: actions/upload-artifact@v6
        with:
          name: typescript-package-tarball
          path: dist/*.tgz
          if-no-files-found: error

  github-release:
    name: "Create GitHub Release"
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download the Python distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Download the TypeScript tarball
        uses: actions/download-artifact@v7
        with:
          name: typescript-package-tarball
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.tgz
          generate_release_notes: true

  publish-to-pypi:
    name: "Upload to PyPI"
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download the Python distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Push to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-npm:
    name: "Upload to npmjs"
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    # npmjs.com must be told to trust this repository and this workflow file
    # before the first run, exactly as JSR is.  Once the trusted publisher is
    # configured, OIDC replaces a long-lived NPM_TOKEN, so no registry secret
    # is stored.  `--provenance` is what requests the OIDC token; without it
    # npm would fall back to looking for a token and fail.
    #
    # A prerelease tag such as `v0.3.0-2` is published under the `next`
    # dist-tag, so `npm install @madduck/squoredata` keeps resolving to the
    # last stable release.  npm refuses to publish a prerelease to `latest`
    # implicitly, and putting it there implicitly is not what a prerelease
    # means.  Opt in with `@next`.
    environment: npmjs
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires npm CLI 11.5.1 or later, and staged
      # publishing requires 11.15.0 or later.  The npm bundled with the Node
      # release happens to satisfy that today, but it is not guaranteed, so
      # pin it.  A mismatch fails as a registry 404, which is hard to read.
      - name: Pin npm
        run: npm install --global npm@11.15.0

      # Publishing the tarball that `build` packed, rather than restamping
      # and repacking the tree, means npm ships exactly the artefact attached
      # to the GitHub Release.  `npm pack` already resolved the files
      # allowlist, so npm gets the same contents.  The version lives inside
      # the tarball, so no stamping step is needed here.
      #
      # The `./` prefix is load-bearing.  Without it npm sees a slash and
      # classifies `dist/<name>.tgz` as a `<host>/<path>` git spec, then tries
      # `git ls-remote ssh://git@github.com/dist/<name>.tgz.git` and fails.  A
      # leading `./` makes npm read the argument as a local file path.
      - name: Download the TypeScript tarball
        uses: actions/download-artifact@v7
        with:
          name: typescript-package-tarball
          path: dist/

      - name: Publish to npmjs
        run: |
          tag=
          case "$GITHUB_REF_NAME" in
            *-*) tag="--tag next" ;;
          esac
          npm publish ./dist/*.tgz --provenance --access public $tag

  publish-to-jsr:
    name: "Upload to JSR"
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    # id-token: write so JSR can verify the repository through OIDC instead of
    # a stored token; no JSR secret is needed.  Publishing a version that
    # already exists fails, so this job is tag-gated and never runs on a
    # branch push.
    environment: jsr
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # index.js imports the subpath "ajv/dist/2020.js", which Deno resolves
      # against a real node_modules.  The "imports" map in jsr.json only
      # rewrites the bare "ajv" specifier, so publishing without a local
      # install fails with "Could not find ajv in a node_modules folder".
      # Deno walks up from typescript/, so a root install is enough.
      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # JSR publishes the source tree, not the tarball, so the artifacts are
      # not needed here; the checkout is the package.  The manifests carry the
      # placeholder version from the generator, so the tag is stamped into them
      # before the publish, exactly as the build job does for the tarball.
      - name: Stamp the release version into the TypeScript manifests
        run: python scripts/stamp_version.py "$GITHUB_REF_NAME"

      - name: Publish to JSR
        # Stamping the version modified the two manifests, so the tree is
        # dirty by design and jsr refuses to publish it without --allow-dirty.
        # The guard it disables protects against publishing uncommitted work;
        # here the tag gates the job and the stamp step is the only change.
        # Committing in the runner instead would attest provenance for a commit
        # that exists nowhere, so keep the dirty stamp and the real tag.
        #
        # The publish is retried, because jsr.io is fronted by Cloudflare and
        # the status check has been seen to fail with `connection reset`
        # before any upload starts.  Retrying is safe: a publish that did
        # complete makes the next attempt fail on the existing version rather
        # than publishing twice.
        run: |
          for attempt in 1 2 3; do
            if npx --yes jsr publish --allow-dirty; then
              exit 0
            fi
            echo "jsr publish attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "jsr publish failed after 3 attempts" >&2
          exit 1
        working-directory: typescript
