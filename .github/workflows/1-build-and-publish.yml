# Build and publish a release.
#
# Triggered by a `v*` tag.  A manual run on a branch only runs the tests and
# the build; publishing stays gated on the tag ref, because a manual run has no
# tag and would try to publish a version that does not exist.
#
# The jobs run in three stages:
#
#   1. `tests` calls _tests.yml.  Nothing is built before the tests pass.
#   2. `build` builds the Python distributions and packs the TypeScript
#      tarball, and uploads both as artifacts.
#   3. `github-release`, `publish-to-pypi`, and `publish-to-jsr` run in
#      parallel, strictly after `build`, and consume those artifacts.
name: Build package, make a release, publish to PyPI and JSR

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # allows manual triggering

jobs:
  tests:
    name: "Tests"
    uses: ./.github/workflows/_tests.yml

  build:
    name: "Build packages"
    runs-on: ubuntu-latest
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check out the source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.x
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install the build tool
        run: python -m pip install build

      # The Hatchling hook regenerates the TypeScript bindings during the
      # build, but only when Node tooling is present.  Installing it here means
      # the wheel is generated from the models rather than from whatever the
      # tree happens to contain.  A build must never reach the network, so the
      # hook stays guarded; the tests have already proven the committed
      # bindings are not stale.
      - name: Install Node dependencies
        run: npm install

      - name: Build the Python package
        run: python -m build

      # The tarball is the registry-free fallback: it installs straight from
      # the release with `npm install <url>`, which needs no account anywhere.
      - name: Pack the TypeScript package
        run: npm pack --pack-destination ../dist
        working-directory: typescript

      - name: Upload the Python distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Upload the TypeScript tarball
        uses: actions/upload-artifact@v6
        with:
          name: typescript-package-tarball
          path: dist/*.tgz
          if-no-files-found: error

  github-release:
    name: "Create GitHub Release"
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download the Python distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Download the TypeScript tarball
        uses: actions/download-artifact@v7
        with:
          name: typescript-package-tarball
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.tgz
          generate_release_notes: true

  publish-to-pypi:
    name: "Upload to PyPI"
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download the Python distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Push to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-jsr:
    name: "Upload to JSR"
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    # id-token: write so JSR can verify the repository through OIDC instead of
    # a stored token; no JSR secret is needed.  Publishing a version that
    # already exists fails, so this job is tag-gated and never runs on a
    # branch push.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # index.js imports the subpath "ajv/dist/2020.js", which Deno resolves
      # against a real node_modules.  The "imports" map in jsr.json only
      # rewrites the bare "ajv" specifier, so publishing without a local
      # install fails with "Could not find ajv in a node_modules folder".
      # Deno walks up from typescript/, so a root install is enough.
      - name: Install Node dependencies
        run: npm ci

      # JSR publishes the source tree, not the tarball, so the artifacts are
      # not needed here; the checkout is the package.
      - name: Publish to JSR
        run: npx --yes jsr publish
        working-directory: typescript
