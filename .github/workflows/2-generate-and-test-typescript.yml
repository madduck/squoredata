name: Generate and test TypeScript bindings

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  generate-and-test-typescript:
    name: "Generate and test TypeScript bindings"
    runs-on: ubuntu-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: uv sync --frozen --group dev

      - name: Install Node dependencies
        run: npm install

      - name: Regenerate the TypeScript bindings
        run: uv run python scripts/generate_ts.py

      - name: Fail if the generated bindings are stale
        run: git diff --exit-code typescript/

      - name: Type-check and run the golden tests (npm)
        run: npm test
