# Reusable test workflow.
#
# This file has no trigger of its own.  0-testing.yml calls it on every push
# and pull request; 1-build-and-publish.yml calls it before it builds, so a
# release can never be published from a tree that does not pass the tests.
name: Tests

on:
  workflow_call:

jobs:
  python-tests:
    name: "Python tests (3.${{ matrix.python-minor }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-minor: ["13", "14"]

    steps:
      - name: Check out the source
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.${{ matrix.python-minor }}"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Style and formatting (ruff)
        run: uv run ruff check .

      - name: Unit and integration tests (pytest)
        run: uv run pytest

      - name: Mypy check
        run: uv run mypy --strict .

      - name: Security lint (bandit)
        run: uv run bandit -c pyproject.toml -r .

  typescript-tests:
    name: "TypeScript bindings"
    runs-on: ubuntu-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: uv sync --frozen --group dev

      - name: Install Node dependencies
        run: npm install

      - name: Regenerate the TypeScript bindings
        run: uv run python scripts/generate_ts.py

      # The committed bindings are the published contract.  If regeneration
      # changes them, the tree is stale and the models and the bindings differ.
      - name: Fail if the generated bindings are stale
        run: git diff --exit-code typescript/

      - name: Type-check and run the golden tests (npm)
        run: npm test